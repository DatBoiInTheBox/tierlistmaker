<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Tier List Kiosk</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&display=swap" rel="stylesheet">
<style>
:root{--ink:#150f2e;--panel:#241b4a;--panel2:#33276a;--tx:#f6f1ff;--mut:#a99fd0;--pink:#ff4d8d;--sun:#ffd23f;--s:clamp(58px,13vw,104px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--ink);color:var(--tx);font-family:'Bricolage Grotesque',system-ui,sans-serif;overflow:hidden;user-select:none;-webkit-user-select:none}
input,textarea{user-select:text;-webkit-user-select:text}
#app{height:100%;display:flex;flex-direction:column;padding:2vh 3vw}
button{font:inherit;color:inherit;border:0;cursor:pointer}
.btn{background:var(--pink);color:#fff;font-weight:800;font-size:clamp(18px,3.2vw,34px);padding:1.5vh 4vw;border-radius:999px}
.btn.alt{background:var(--panel2)}.btn.sun{background:var(--sun);color:#241b00}.btn.sm{font-size:clamp(14px,2vw,20px);padding:1vh 2.4vw}
.btn:disabled{opacity:.35}
h1{font-weight:800;margin:0;line-height:.92;font-size:clamp(44px,13vw,140px);text-wrap:balance}
h2{margin:0 0 1vh;font-size:clamp(20px,3.4vw,36px)}
p{margin:.6vh 0;color:var(--mut);font-size:clamp(15px,2.3vw,24px)}
.home{flex:1;display:flex;flex-direction:column;justify-content:center;gap:3vh;align-items:flex-start}
.stack{width:100%;display:flex;flex-direction:column;gap:1vh;margin-bottom:2vh}
.stack i{font-style:normal;font-weight:800;color:#1b1400;font-size:clamp(20px,4.5vw,48px);padding:1vh 2vw;border-radius:12px}
.gear{position:fixed;right:10px;bottom:8px;background:none;opacity:.25;font-size:26px}
.top{display:flex;justify-content:space-between;align-items:center;gap:2vw;margin-bottom:1.2vh}
.top h2{margin:0}
.tiers{flex:1;overflow:auto}
.row{display:flex;margin-bottom:1vh;min-height:calc(var(--s) + 14px)}
.lab{width:clamp(56px,11vw,110px);flex:none;border-radius:14px 0 0 14px;display:grid;place-items:center;color:#1b1400;font-weight:800;font-size:clamp(16px,3.6vw,38px);text-align:center;padding:4px;line-height:1;overflow-wrap:anywhere}
.zone{flex:1;background:var(--panel);border-radius:0 14px 14px 0;padding:7px;display:flex;flex-wrap:wrap;gap:7px;align-content:flex-start}
.armed .zone,.armed.pool{outline:3px dashed var(--sun);outline-offset:-3px}
.pool{background:#1e1642;border-radius:14px;padding:8px;display:flex;flex-wrap:wrap;gap:7px;max-height:32vh;min-height:calc(var(--s) + 16px);overflow:auto;margin-top:.6vh}
.chip{width:var(--s);height:var(--s);border-radius:12px;background:var(--panel2);position:relative;overflow:hidden;touch-action:none;flex:none;display:grid;place-items:center;font-size:calc(var(--s)*.5);font-weight:800}
.chip img{width:100%;height:100%;object-fit:cover;pointer-events:none;position:absolute;inset:0}
.chip b{position:absolute;left:0;right:0;bottom:0;font-size:clamp(9px,1.5vw,14px);line-height:1.1;padding:12% 3% 3%;background:linear-gradient(transparent,rgba(0,0,0,.85));text-align:center;font-weight:500;max-height:55%;overflow:hidden}
.chip.sel{outline:4px solid var(--sun);transform:scale(1.07)}
.chip.mini{--s:46px;font-size:22px}.chip.mini b{display:none}
.ghost{position:fixed;pointer-events:none;z-index:99;transform:translate(-50%,-50%) scale(1.15);box-shadow:0 10px 30px #000a}
.bar{display:flex;gap:2vw;align-items:center;justify-content:space-between;margin-top:1.2vh}
.tabs{display:flex;gap:1.4vw;margin-bottom:1.4vh}
.tabs button{flex:1;background:var(--panel);padding:1.3vh 1vw;border-radius:12px;font-weight:800;font-size:clamp(13px,2.3vw,24px)}
.tabs button.on{background:var(--sun);color:#241b00}
.scroll{flex:1;overflow:auto;padding-right:4px}
.card{background:var(--panel);border-radius:18px;padding:2vh 3vw;margin-bottom:1.6vh}
.ring{display:flex;align-items:center;gap:4vw}
.ring svg{width:clamp(120px,28vw,260px);flex:none}
.ring .n{font-size:clamp(34px,8vw,80px);font-weight:800}
.lb{display:flex;align-items:center;gap:2vw;margin:.8vh 0}
.lb .t{flex:1;height:clamp(18px,3vh,30px);background:#00000040;border-radius:8px;overflow:hidden;display:flex}
.lb .t i{display:block;height:100%}
.lb span.v{width:4.5em;text-align:right;font-size:clamp(13px,2vw,20px);color:var(--mut)}
.nm{width:22vw;font-size:clamp(13px,2.1vw,22px);line-height:1.1}
.hot{display:flex;align-items:center;gap:3vw;margin:1vh 0;font-size:clamp(14px,2.3vw,24px)}
table{border-collapse:collapse;width:100%}
td,th{padding:3px;text-align:center;font-size:clamp(12px,2vw,20px)}
th{color:#1b1400}
td.l{text-align:left}
/* admin */
.adm label{display:block;color:var(--mut);margin:1vh 0 .4vh;font-size:15px}
input,textarea{width:100%;background:#0f0a24;color:var(--tx);border:2px solid var(--panel2);border-radius:10px;padding:10px 12px;font:inherit;font-size:18px}
.fl{display:flex;gap:10px;align-items:center;margin:6px 0}
.fl>input{flex:1}
.fl input[type=color]{width:54px;padding:2px;height:44px;flex:none}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.itm{background:#0f0a24;border-radius:12px;padding:8px;display:flex;flex-direction:column;gap:6px;align-items:center}
.itm input{font-size:15px;padding:6px}
.pick{cursor:pointer;width:100%;height:auto;aspect-ratio:1}
.pick.added{opacity:.35}
.x{background:#5a1535;border-radius:8px;padding:6px 12px}
.keys{display:grid;grid-template-columns:repeat(3,1fr);gap:2vw;width:min(90%,520px)}
.keys button{background:var(--panel2);font-size:clamp(28px,6vw,52px);font-weight:800;padding:2.4vh 0;border-radius:18px}
.dots{font-size:clamp(34px,8vw,70px);letter-spacing:.3em;height:1.3em}
.mid{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3vh;text-align:center}
.toast{position:fixed;left:50%;bottom:6vh;transform:translateX(-50%);background:var(--sun);color:#241b00;padding:12px 22px;border-radius:999px;font-weight:800;z-index:200}
@media (prefers-reduced-motion:no-preference){.chip{transition:transform .12s}}
</style></head><body>
<div id="app"></div>
<script>
const $=s=>document.querySelector(s),app=$('#app'),KEY='tierkiosk.v1';
const uid=()=>Math.random().toString(36).slice(2,9);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function defaults(){return{title:'Rank It!',pin:'1234',
 tiers:[['S','#ff6b6b'],['A','#ffa94d'],['B','#ffd43b'],['C','#8ce99a'],['D','#74c0fc']].map(([name,color])=>({id:uid(),name,color})),
 items:[['Pizza','🍕'],['Tacos','🌮'],['Sushi','🍣'],['Burgers','🍔'],['Ice cream','🍦'],['Salad','🥗'],['Ramen','🍜'],['Pancakes','🥞']].map(([name,e])=>({id:uid(),name,e})),subs:[]}}
let S=(()=>{try{const d=JSON.parse(localStorage.getItem(KEY));if(d&&d.tiers&&d.items)return d}catch(e){}return defaults()})();
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){toast('Storage is full. Remove some uploaded images.')}}
function toast(m){const t=document.createElement('div');t.className='toast';t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),2500)}
let V='home',sess={},sel=null,tab='you',last=null,idle=Date.now(),pin='';
const face=it=>it.img?`<img src="${esc(it.img)}" alt="${esc(it.name)}" referrerpolicy="no-referrer">`:`<span>${esc(it.e||it.name[0]||'?')}</span>`;
const chip=(it,c='')=>`<div class="chip ${c}" data-id="${it.id}">${face(it)}<b>${esc(it.name)}</b></div>`;
const item=id=>S.items.find(i=>i.id===id);
document.addEventListener('error',e=>{const t=e.target;if(t.tagName==='IMG'){const s=document.createElement('span');s.textContent=(t.alt||'?')[0];t.replaceWith(s)}},true);

/* ---------- views ---------- */
function render(){({home,play:renderPlay,results:renderResults,pin:renderPin,admin:renderAdmin})[V]()}
function home(){
 const n=S.tiers.length,np=S.subs.length;
 app.innerHTML=`<div class="home"><div class="stack">${S.tiers.map((t,i)=>`<i style="background:${t.color};width:${100-i*(50/Math.max(1,n-1))}%">${esc(t.name)}</i>`).join('')}</div>
 <h1>${esc(S.title)}</h1><div><p>Sort ${S.items.length} things into tiers.</p><p>${np?`${np} ${np==1?'person has':'people have'} ranked so far.`:'Be the first to rank.'}</p></div>
 <button class="btn" data-act="start" ${S.items.length<2?'disabled':''}>Start ranking</button>
 ${np?'<button class="btn alt" data-act="crowd">See what everyone thinks</button>':''}
 ${S.items.length<2?'<p>The host needs to add at least 2 options.</p>':''}</div><button class="gear" data-act="admin" aria-label="Host settings">⚙</button>`}
function renderPlay(){
 const left=S.items.filter(i=>!sess[i.id]||!S.tiers.some(t=>t.id===sess[i.id])),placed=S.items.length-left.length,arm=sel?'armed':'';
 app.innerHTML=`<div class="top"><h2>${esc(S.title)}</h2><p>${placed} of ${S.items.length} placed</p></div>
 <div class="tiers">${S.tiers.map(t=>`<div class="row ${arm}"><div class="lab" style="background:${t.color}">${esc(t.name)}</div><div class="zone" data-drop="${t.id}">${S.items.filter(i=>sess[i.id]===t.id).map(i=>chip(i,i.id===sel?'sel':'')).join('')}</div></div>`).join('')}</div>
 <p style="text-align:center">${sel?'Now tap a tier to place it.':left.length?'Drag an option into a tier, or tap it and then tap a tier.':'All placed. Tap submit when you are happy.'}</p>
 <div class="pool ${arm}" data-drop="pool">${left.map(i=>chip(i,i.id===sel?'sel':'')).join('')}</div>
 <div class="bar"><button class="btn alt sm" data-act="home">Cancel</button><button class="btn sun" data-act="submit" ${left.length?'disabled':''}>Submit my tiers</button></div>`}
function place(id,to){if(to==='pool')delete sess[id];else sess[id]=to;sel=null;renderPlay()}

/* ---------- stats ---------- */
function stats(excl){
 const n=S.tiers.length,ix={};S.tiers.forEach((t,i)=>ix[t.id]=i);
 const m={};S.items.forEach(it=>m[it.id]={it,c:Array(n).fill(0),k:0,sum:0});
 S.subs.forEach(s=>{if(s===excl)return;for(const id in s.p){const i=ix[s.p[id]];if(m[id]&&i!=null){m[id].c[i]++;m[id].k++;m[id].sum+=i}}});
 const a=Object.values(m).filter(x=>x.k);
 a.forEach(x=>{x.mean=x.sum/x.k;x.sd=Math.sqrt(x.c.reduce((q,c,i)=>q+c*(i-x.mean)**2,0)/x.k);x.score=n>1?(1-x.mean/(n-1))*100:100});
 return{a,ix,n}}
const tn=i=>S.tiers[Math.max(0,Math.min(S.tiers.length-1,Math.round(i)))];
const tag=t=>`<b style="background:${t.color};color:#1b1400;padding:2px 10px;border-radius:8px">${esc(t.name)}</b>`;

function renderResults(){
 const tabs=[...(last?[['you','You vs crowd']]:[]),['crowd','Crowd tiers'],['heat','Heatmap'],['split','Divisive']];
 if(!tabs.some(t=>t[0]===tab))tab=tabs[0][0];
 let body='';
 if(!S.subs.length)body='<div class="card"><p>No results yet.</p></div>';
 else if(tab==='you')body=tabYou();else if(tab==='crowd')body=tabCrowd();else if(tab==='heat')body=tabHeat();else body=tabSplit();
 app.innerHTML=`<div class="top"><h2>${last?'Thanks! Here is how you compare':'What everyone thinks'}</h2><p>${S.subs.length} ${S.subs.length==1?'player':'players'}</p></div>
 <div class="tabs">${tabs.map(([k,l])=>`<button class="${k===tab?'on':''}" data-act="tab" data-v="${k}">${l}</button>`).join('')}</div>
 <div class="scroll">${body}</div><div class="bar"><button class="btn" data-act="home">Done</button></div>`}

function tabYou(){
 const o=S.subs.filter(s=>s!==last);
 if(!o.length)return'<div class="card"><h2>You are the first player</h2><p>Your picks are now the crowd. Ask a friend to play and come back to see how you match.</p></div>';
 const st=stats(last),n=st.n,d=n-1||1,rows=st.a.filter(x=>last.p[x.it.id]!=null&&st.ix[last.p[x.it.id]]!=null).map(x=>{const y=st.ix[last.p[x.it.id]];return{x,y,diff:y-x.mean}});
 const match=rows.length?100*(1-rows.reduce((q,r)=>q+Math.abs(r.diff),0)/rows.length/d):0;
 const verdict=match>=85?'Mind-meld with the crowd':match>=70?'Basically a local':match>=55?'Pleasantly opinionated':match>=40?'Bold taste':'Certified rebel';
 const C=2*Math.PI*54,hot=[...rows].sort((a,b)=>Math.abs(b.diff)-Math.abs(a.diff)).slice(0,3),sure=[...rows].sort((a,b)=>Math.abs(a.diff)-Math.abs(b.diff))[0];
 let twin=null;const ix=st.ix;
 o.forEach(s=>{const sh=Object.keys(last.p).filter(id=>s.p[id]!=null&&ix[s.p[id]]!=null&&ix[last.p[id]]!=null);if(!sh.length)return;const sim=100*(1-sh.reduce((q,id)=>q+Math.abs(ix[s.p[id]]-ix[last.p[id]]),0)/sh.length/d);if(!twin||sim>twin)twin=sim});
 return`<div class="card ring"><svg viewBox="0 0 120 120"><circle cx="60" cy="60" r="54" fill="none" stroke="#00000050" stroke-width="12"/><circle cx="60" cy="60" r="54" fill="none" stroke="var(--sun)" stroke-width="12" stroke-linecap="round" stroke-dasharray="${C*match/100} ${C}" transform="rotate(-90 60 60)"/></svg>
 <div><div class="n">${Math.round(match)}%</div><h2>${verdict}</h2><p>Match with the crowd</p></div></div>
 <div class="card"><h2>Your hottest takes</h2>${hot.map(r=>`<div class="hot">${chip(r.x.it,'mini')}<div><b>${esc(r.x.it.name)}</b><br>You: ${tag(S.tiers[r.y])} Crowd: ${tag(tn(r.x.mean))}</div></div>`).join('')}
 ${sure?`<p>Most in sync: <b>${esc(sure.x.it.name)}</b></p>`:''}</div>
 ${twin!=null?`<div class="card"><h2>Your closest tier twin</h2><p>Someone who played before you agrees with ${Math.round(twin)}% of your picks.</p></div>`:''}`}

function tabCrowd(){
 const st=stats(),a=[...st.a].sort((x,y)=>y.score-x.score);if(!a.length)return'<div class="card"><p>Nothing to show yet.</p></div>';
 const rows=S.tiers.map((t,i)=>`<div class="row"><div class="lab" style="background:${t.color}">${esc(t.name)}</div><div class="zone">${a.filter(x=>Math.round(x.mean)===i).map(x=>chip(x.it)).join('')}</div></div>`).join('');
 return`<div class="card"><h2>The crowd's tier list</h2>${rows}</div>
 <div class="card"><h2>Leaderboard</h2><p>👑 Favorite: <b>${esc(a[0].it.name)}</b>. Least loved: <b>${esc(a[a.length-1].it.name)}</b>.</p>
 ${a.map(x=>`<div class="lb"><span class="nm">${esc(x.it.name)}</span><div class="t"><i style="width:${x.score}%;background:${tn(x.mean).color}"></i></div><span class="v">${Math.round(x.score)}</span></div>`).join('')}</div>`}

function tabHeat(){
 const st=stats(),a=[...st.a].sort((x,y)=>y.score-x.score);if(!a.length)return'<div class="card"><p>Nothing to show yet.</p></div>';
 return`<div class="card"><h2>Where every option landed</h2><p>Brighter cells mean more votes for that tier.</p><table><tr><th></th>${S.tiers.map(t=>`<th style="background:${t.color}">${esc(t.name)}</th>`).join('')}</tr>
 ${a.map(x=>`<tr><td class="l">${esc(x.it.name)}</td>${x.c.map((c,i)=>`<td style="background:color-mix(in srgb,${S.tiers[i].color} ${Math.round(c/x.k*100)}%,#00000030);color:${c/x.k>.5?'#1b1400':'inherit'}">${c||''}</td>`).join('')}</tr>`).join('')}</table></div>`}

function tabSplit(){
 const st=stats(),a=[...st.a].sort((x,y)=>y.sd-x.sd);if(!a.length)return'<div class="card"><p>Nothing to show yet.</p></div>';
 const bar=x=>`<div class="lb"><span class="nm">${esc(x.it.name)}</span><div class="t">${x.c.map((c,i)=>c?`<i title="${esc(S.tiers[i].name)}" style="width:${c/x.k*100}%;background:${S.tiers[i].color}"></i>`:'').join('')}</div></div>`;
 return`<div class="card"><h2>Most divisive</h2><p>${esc(a[0].it.name)} split the room the most.</p>${a.map(bar).join('')}</div>
 <div class="card"><h2>Biggest agreement</h2><p>Everyone mostly agreed on <b>${esc(a[a.length-1].it.name)}</b>.</p></div>`}

/* ---------- PIN ---------- */
function renderPin(){app.innerHTML=`<div class="mid"><h2>Host PIN</h2><div class="dots">${'●'.repeat(pin.length)||'&nbsp;'}</div><div class="keys">${[1,2,3,4,5,6,7,8,9,'✕',0,'⌫'].map(k=>`<button data-act="key" data-v="${k}">${k}</button>`).join('')}</div></div>`}

/* ---------- admin ---------- */
function renderAdmin(){
 app.innerHTML=`<div class="top"><h2>Host settings</h2><button class="btn sun sm" data-act="home">Save and exit</button></div><div class="scroll adm">
 <div class="card"><label>Tier list title</label><input data-f="title" value="${esc(S.title)}"></div>
 <div class="card"><h2>Add options</h2>
  <label>Search Wikipedia pictures (tap to add)</label><div class="fl"><input id="q" placeholder="e.g. golden retriever, pizza, Mario Kart"><button class="btn sm" data-act="search">Search</button></div>
  <div class="grid" id="sr"></div>
  <label>Paste image links, one per line. Optional name first: Name | https://…</label><textarea id="bulk" rows="4"></textarea><button class="btn alt sm" data-act="bulk" style="margin-top:8px">Import links</button>
  <label>Or upload from this device</label><input type="file" id="up" accept="image/*" multiple>
  <label>Text-only option</label><div class="fl"><input id="tn" placeholder="Name"><input id="te" placeholder="Emoji (optional)" style="max-width:150px"><button class="btn alt sm" data-act="addtext">Add</button></div></div>
 <div class="card"><h2>Options (<span id="cnt"></span>)</h2><div class="grid" id="il"></div></div>
 <div class="card"><h2>Tiers (top to bottom)</h2><div id="tl"></div><button class="btn alt sm" data-act="addtier">Add tier</button></div>
 <div class="card"><h2>Data</h2><p>${S.subs.length} submissions saved on this device.</p><div class="fl" style="flex-wrap:wrap">
  <button class="btn alt sm" data-act="clear">Clear results</button><button class="btn alt sm" data-act="export">Export backup</button>
  <label class="btn alt sm" style="margin:0;color:var(--tx)">Import backup<input type="file" id="imp" accept=".json" hidden></label>
  <button class="btn alt sm" data-act="newpin">Change PIN</button><button class="x" data-act="reset">Reset everything</button></div></div></div>`;
 itemsUI();tiersUI()}
function itemsUI(){$('#cnt').textContent=S.items.length;$('#il').innerHTML=S.items.map(i=>`<div class="itm">${chip(i)}<input data-f="iname" data-id="${i.id}" value="${esc(i.name)}"><button class="x" data-act="deli" data-id="${i.id}">Remove</button></div>`).join('')||'<p>No options yet.</p>'}
function tiersUI(){$('#tl').innerHTML=S.tiers.map((t,i)=>`<div class="fl"><input type="color" data-f="tcolor" data-id="${t.id}" value="${t.color}"><input data-f="tname" data-id="${t.id}" value="${esc(t.name)}"><button class="btn alt sm" data-act="mv" data-id="${t.id}" data-d="-1" ${i?'':'disabled'}>↑</button><button class="btn alt sm" data-act="mv" data-id="${t.id}" data-d="1" ${i<S.tiers.length-1?'':'disabled'}>↓</button><button class="x" data-act="delt" data-id="${t.id}" ${S.tiers.length>2?'':'disabled'}>✕</button></div>`).join('')}
function addItem(name,img,e){S.items.push({id:uid(),name:name.trim().slice(0,40)||'Untitled',img,e});save();itemsUI()}
async function wiki(q){
 const r=$('#sr');r.textContent='Searching…';
 try{const j=await(await fetch('https://en.wikipedia.org/w/api.php?action=query&format=json&origin=*&generator=search&gsrlimit=30&prop=pageimages&piprop=thumbnail&pithumbsize=320&gsrsearch='+encodeURIComponent(q))).json();
  const p=Object.values(j.query?.pages||{}).filter(x=>x.thumbnail).sort((a,b)=>a.index-b.index);
  r.innerHTML=p.length?p.map(x=>`<div class="chip pick" data-act="pick" data-n="${esc(x.title)}" data-u="${esc(x.thumbnail.source)}"><img src="${esc(x.thumbnail.source)}" alt="${esc(x.title)}"><b>${esc(x.title)}</b></div>`).join(''):'No pictures found. Try another search.'}
 catch(e){r.textContent="Couldn't reach Wikipedia. Check the kiosk's internet connection."}}
const shrink=f=>new Promise(res=>{const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,320/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*k;c.height=im.height*k;c.getContext('2d').drawImage(im,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',.8))};im.onerror=()=>res(null);im.src=r.result};r.readAsDataURL(f)});

/* ---------- events ---------- */
app.addEventListener('pointerdown',e=>{
 idle=Date.now();if(V!=='play')return;
 const c=e.target.closest('.chip[data-id]');if(!c)return;
 const id=c.dataset.id,x0=e.clientX,y0=e.clientY;let g=null;
 const mv=ev=>{if(!g&&Math.hypot(ev.clientX-x0,ev.clientY-y0)>10){g=c.cloneNode(true);g.classList.add('ghost');g.classList.remove('sel');document.body.appendChild(g);c.style.opacity=.3}
  if(g){g.style.left=ev.clientX+'px';g.style.top=ev.clientY+'px'}};
 const up=ev=>{removeEventListener('pointermove',mv);removeEventListener('pointerup',up);removeEventListener('pointercancel',up);
  if(g){g.remove();const z=ev.type==='pointerup'&&document.elementFromPoint(ev.clientX,ev.clientY)?.closest('[data-drop]');z?place(id,z.dataset.drop):renderPlay()}
  else{sel=sel===id?null:id;renderPlay()}};
 addEventListener('pointermove',mv);addEventListener('pointerup',up);addEventListener('pointercancel',up)});
app.addEventListener('click',async e=>{
 idle=Date.now();
 if(V==='play'&&sel&&!e.target.closest('.chip')){const z=e.target.closest('[data-drop]');if(z)return place(sel,z.dataset.drop)}
 const b=e.target.closest('[data-act]');if(!b)return;const id=b.dataset.id;
 switch(b.dataset.act){
 case'start':sess={};sel=null;last=null;V='play';return render();
 case'home':V='home';last=null;return render();
 case'crowd':last=null;tab='crowd';V='results';return render();
 case'tab':tab=b.dataset.v;return render();
 case'submit':{const s={t:Date.now(),p:{...sess}};S.subs.push(s);save();last=s;tab='you';V='results';return render()}
 case'admin':pin='';V='pin';return render();
 case'key':{const v=b.dataset.v;if(v==='✕'){V='home';return render()}pin=v==='⌫'?pin.slice(0,-1):pin+v;if(pin===String(S.pin)){V='admin';return render()}if(pin.length>=String(S.pin).length){pin='';toast('Wrong PIN')}return renderPin()}
 case'search':{const q=$('#q').value.trim();if(q)wiki(q);return}
 case'pick':if(!b.classList.contains('added')){addItem(b.dataset.n,b.dataset.u);b.classList.add('added')}return;
 case'bulk':{const L=$('#bulk').value.split('\n').map(x=>x.trim()).filter(Boolean);L.forEach(l=>{let n,u;if(l.includes('|'))[n,u]=l.split('|').map(x=>x.trim());else u=l;if(!/^https?:/i.test(u||''))return;if(!n){try{n=decodeURIComponent(new URL(u).pathname.split('/').pop().replace(/\.[a-z0-9]+$/i,'')).replace(/[-_]+/g,' ')}catch(_){n='Image'}}addItem(n,u)});$('#bulk').value='';return}
 case'addtext':{const n=$('#tn').value;if(n.trim()){addItem(n,null,$('#te').value.trim());$('#tn').value=$('#te').value=''}return}
 case'deli':S.items=S.items.filter(i=>i.id!==id);save();return itemsUI();
 case'addtier':S.tiers.push({id:uid(),name:'New',color:'#b197fc'});save();return tiersUI();
 case'delt':if(confirm('Remove this tier? Past results for it will be ignored.')){S.tiers=S.tiers.filter(t=>t.id!==id);save();tiersUI()}return;
 case'mv':{const i=S.tiers.findIndex(t=>t.id===id),j=i+ +b.dataset.d;[S.tiers[i],S.tiers[j]]=[S.tiers[j],S.tiers[i]];save();return tiersUI()}
 case'clear':if(confirm('Delete all submissions?')){S.subs=[];save();renderAdmin()}return;
 case'reset':if(confirm('Reset everything, including options and tiers?')){S=defaults();save();renderAdmin()}return;
 case'newpin':{const p=prompt('New PIN (digits only):');if(p&&/^\d{3,8}$/.test(p)){S.pin=p;save();toast('PIN changed')}else if(p)toast('Use 3 to 8 digits');return}
 case'export':{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(S)],{type:'application/json'}));a.download='tier-list-backup.json';a.click();return}
 }});
app.addEventListener('change',async e=>{
 const t=e.target;
 if(t.id==='up'){for(const f of t.files){const d=await shrink(f);if(d)addItem(f.name.replace(/\.[^.]+$/,'').replace(/[-_]+/g,' '),d)}t.value='';return}
 if(t.id==='imp'){try{const d=JSON.parse(await t.files[0].text());if(!d.tiers||!d.items)throw 0;S=d;S.subs=S.subs||[];S.pin=S.pin||'1234';save();renderAdmin();toast('Backup imported')}catch(_){toast('That file is not a valid backup')}return}
 const f=t.dataset.f;if(!f)return;const id=t.dataset.id;
 if(f==='title')S.title=t.value.trim()||'Rank It!';
 if(f==='iname')item(id).name=t.value.trim()||'Untitled';
 if(f==='tname')S.tiers.find(x=>x.id===id).name=t.value.trim()||'?';
 if(f==='tcolor')S.tiers.find(x=>x.id===id).color=t.value;
 save();if(f==='iname')itemsUI()});
app.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='q')wiki(e.target.value.trim())});
setInterval(()=>{if(['play','results','pin'].includes(V)&&Date.now()-idle>120000){V='home';last=null;render()}},5000);
render();
</script></body></html>
